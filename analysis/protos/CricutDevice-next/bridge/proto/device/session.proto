// recovered FileDescriptorProto: bridge/proto/device/session.proto
edition = "2023";
package bridge.proto.device;
import "bridge/proto/device/device.proto";

enum SessionOpenResult {
  SESSION_OPEN_RESULT_UNSPECIFIED = 0;
  SESSION_OPEN_RESULT_SUCCESS = 1;
  SESSION_OPEN_RESULT_UNKNOWN_ERROR = 2;
  SESSION_OPEN_RESULT_ERROR_DEVICE_NOT_FOUND = 3;
  SESSION_OPEN_RESULT_ERROR_EXISTING_SESSION = 4;
}

enum SessionCloseResult {
  SESSION_CLOSE_RESULT_UNSPECIFIED = 0;
  SESSION_CLOSE_RESULT_SUCCESS = 1;
  SESSION_CLOSE_RESULT_UNKNOWN_ERROR = 2;
  SESSION_CLOSE_RESULT_ERROR_DEVICE_NOT_FOUND = 3;
  SESSION_CLOSE_RESULT_ERROR_NO_SESSION = 4;
}

enum SessionDataStreamResult {
  SESSION_DATA_STREAM_RESULT_UNSPECIFIED = 0;
  SESSION_DATA_STREAM_RESULT_SUCCESS = 1;
  SESSION_DATA_STREAM_RESULT_ERROR = 2;
  SESSION_DATA_STREAM_RESULT_ERROR_SESSION_NOT_FOUND = 3;
}

message SessionOpenRequest {
  bridge.proto.device.DeviceHandle handle = 1;
}

message SessionOpenResponse {
  bridge.proto.device.DeviceHandle handle = 1;
  bridge.proto.device.SessionOpenResult result = 2;
}

message SessionCloseRequest {
  bridge.proto.device.DeviceHandle handle = 1;
}

message SessionCloseResponse {
  bridge.proto.device.DeviceHandle handle = 1;
  bridge.proto.device.SessionCloseResult result = 2;
}

message SessionDataStreamRequest {
  bridge.proto.device.DeviceHandle handle = 1;
  bytes data = 2;
}

message SessionDataStreamResponse {
  bridge.proto.device.DeviceHandle handle = 1;
  bridge.proto.device.SessionDataStreamResult result = 2;
}

