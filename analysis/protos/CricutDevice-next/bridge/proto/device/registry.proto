// recovered FileDescriptorProto: bridge/proto/device/registry.proto
edition = "2023";
package bridge.proto.device;
import "bridge/proto/device/device.proto";

enum RegistryAddResult {
  REGISTRY_ADD_RESULT_UNSPECIFIED = 0;
  REGISTRY_ADD_RESULT_SUCCESS = 1;
  REGISTRY_ADD_RESULT_UNKNOWN_ERROR = 2;
  REGISTRY_ADD_RESULT_ERROR_ALREADY_REGISTERED = 3;
  REGISTRY_ADD_RESULT_ERROR_INVALID_DEVICE = 4;
}

enum RegistryUpdateResult {
  REGISTRY_UPDATE_RESULT_UNSPECIFIED = 0;
  REGISTRY_UPDATE_RESULT_SUCCESS = 1;
  REGISTRY_UPDATE_RESULT_UNKNOWN_ERROR = 2;
  REGISTRY_UPDATE_RESULT_ERROR_NOT_REGISTERED = 3;
  REGISTRY_UPDATE_RESULT_ERROR_INVALID_DEVICE = 4;
  REGISTRY_UPDATE_RESULT_ERROR_IDENTITY_MISMATCH = 5;
}

enum RegistryRemoveResult {
  REGISTRY_REMOVE_RESULT_UNSPECIFIED = 0;
  REGISTRY_REMOVE_RESULT_SUCCESS = 1;
  REGISTRY_REMOVE_RESULT_UNKNOWN_ERROR = 2;
  REGISTRY_REMOVE_RESULT_ERROR_NOT_REGISTERED = 3;
}

message RegistryAddRequest {
  bridge.proto.device.Device device = 1;
}

message RegistryAddResponse {
  bridge.proto.device.DeviceHandle handle = 1;
  bridge.proto.device.RegistryAddResult result = 2;
}

message RegistryUpdateRequest {
  bridge.proto.device.Device device = 1;
}

message RegistryUpdateResponse {
  bridge.proto.device.DeviceHandle handle = 1;
  bridge.proto.device.RegistryUpdateResult result = 2;
}

message RegistryRemoveRequest {
  bridge.proto.device.DeviceHandle handle = 1;
}

message RegistryRemoveResponse {
  bridge.proto.device.DeviceHandle handle = 1;
  bridge.proto.device.RegistryRemoveResult result = 2;
}

message RegistryRemoveAllRequest {
}

message RegistryRemoveAllResponse {
}

message RegistryGetAllRequest {
}

message RegistryGetAllResponse {
  repeated bridge.proto.device.Device devices = 1;
}

