// recovered FileDescriptorProto: bridge/proto/NativeModel.Backlash.proto
syntax = "proto3";
package NativeModel.Bridge;
import "bridge/proto/NativeModel.Devices.proto";

enum PBBacklashCalibrationType {
  NONE_BLT = 0;
  CUT_BLT = 1;
  DRAW_BLT = 2;
  CUT_DRAW_BLT = 4;
}

message PBBacklashExecution {
  string id = 1;
  NativeModel.Bridge.PBBacklashCalibrationType type = 2;
  NativeModel.PBPoint cut_settings = 3;
  NativeModel.PBPoint draw_settings = 4;
  NativeModel.Bridge.PBBacklashSettings settings = 5;
  float current_x_blade_backlash = 6;
  float current_y_blade_backlash = 7;
  float current_x_pen_backlash = 8;
  float current_y_pen_backlash = 9;
  NativeModel.Bridge.PBBacklashSaveValues save_values = 10;
}

message PBBacklashSettings {
  string id = 1;
  double blade_offset = 2;
  double bezier_divisions = 3;
  uint32 steps_x = 4;
  uint32 steps_y = 5;
  NativeModel.PBPoint scale = 6;
  float x_backlash_start = 7;
  float x_backlash_stop = 8;
  float y_backlash_start = 9;
  float y_backlash_stop = 10;
  uint32 z_motor_speed = 11;
  bool pack_draw_vector_commands = 12;
  bool enable_tangential_cutting = 13;
  bool honor_blade_angle_over_start_position = 14;
}

message PBBacklashSaveValues {
  string id = 1;
  NativeModel.Bridge.PBBacklashCalibrationType type = 2;
  repeated uint32 cut_horizontal_choices = 3;
  repeated uint32 cut_vertical_choices = 4;
  repeated uint32 draw_horizontal_choices = 5;
  repeated uint32 draw_vertical_choices = 6;
  uint32 cut_horizontal_choice = 7;
  uint32 cut_vertical_choice = 8;
  uint32 draw_horizontal_choice = 9;
  uint32 draw_vertical_choice = 10;
  bool save_as_factory_defaults = 11;
  repeated float cut_horizontal_choices_increment = 12;
  repeated float cut_vertical_choices_increment = 13;
  repeated float draw_horizontal_choices_increment = 14;
  repeated float draw_vertical_choices_increment = 15;
  bool do_save_settings = 16;
}

