// recovered FileDescriptorProto: bridge/proto/NativeModel.Learning.proto
syntax = "proto3";
package NativeModel;

enum PBGramType {
  HMM_SINGLE = 0;
  HMM_DOUBLE = 1;
  HMM_TRIPLE = 2;
  HMM_FOUR = 3;
  HMM_FIVE = 4;
  HMM_SIX = 5;
  HMM_SEVEN = 6;
  HMM_EIGHT = 7;
}

message PBTransmission {
  string id = 1;
  NativeModel.PBGramType gram_type = 2;
  bytes gram = 3;
  string emission_id = 4;
  double log_probability = 5;
}

message PBEmission {
  string id = 1;
  bytes value = 2;
}

message PBDataRepo {
  string id = 1;
  repeated NativeModel.PBTransmission transmissions = 2;
  repeated NativeModel.PBEmission emissions = 3;
  string semantic_tag = 4;
}

