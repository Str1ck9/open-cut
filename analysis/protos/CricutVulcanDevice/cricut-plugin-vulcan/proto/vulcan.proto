// recovered FileDescriptorProto: cricut-plugin-vulcan/proto/vulcan.proto
syntax = "proto3";
package cricut.plugin_vulcan.proto;

enum ConnectionType {
  NONE = 0;
  USB = 1;
  BLUETOOTH = 2;
  UNIT_DEVICE = 10;
}

message DeviceId {
  string name = 1;
  string serial_number = 2;
  string path = 3;
}

message ConnectionInfo {
  cricut.plugin_vulcan.proto.DeviceId device_id = 1;
  float timeout_seconds = 2;
  cricut.plugin_vulcan.proto.ConnectionType connection_type = 3;
}

message Progress {
  int32 sent_bytes = 1;
  int32 total_bytes = 2;
}

message FindDevicesRequest {
  repeated cricut.plugin_vulcan.proto.ConnectionType connection_types = 1;
}

message FindDevicesResponse {
  message Device {
    cricut.plugin_vulcan.proto.DeviceId device_id = 1;
    cricut.plugin_vulcan.proto.ConnectionType connection_type = 2;
  }
  repeated cricut.plugin_vulcan.proto.FindDevicesResponse.Device devices = 1;
}

message GetPodInfoRequest {
  cricut.plugin_vulcan.proto.ConnectionInfo connection = 1;
}

message GetPodInfoResponse {
  enum Result {
    UNKNOWN = 0;
    SUCCESS = 1;
    ERROR_NO_DEVICE = 2;
    ERROR_DEVICE_AUTH_FAILED = 3;
  }
  message Info {
    string serial_number = 1;
    uint32 firmware_version = 2;
    uint32 hardware_version = 3;
    uint32 main_unit_firmware_version = 4;
    string main_unit_serial_number = 5;
    bool activated = 6;
  }
  cricut.plugin_vulcan.proto.DeviceId device_id = 1;
  cricut.plugin_vulcan.proto.GetPodInfoResponse.Result result = 2;
  cricut.plugin_vulcan.proto.GetPodInfoResponse.Info info = 3;
}

message UpdatePodFirmwareRequest {
  cricut.plugin_vulcan.proto.ConnectionInfo connection = 1;
  string firmware_path = 2;
  bytes firmware_data = 3;
}

message UpdatePodFirmwareResponse {
  enum Result {
    UNKNOWN = 0;
    SUCCESS = 1;
    ERROR_NO_DEVICE = 2;
    ERROR_INVALID_FIRMWARE = 3;
    ERROR_BOOTLOADER_FAILED = 4;
  }
  cricut.plugin_vulcan.proto.DeviceId device_id = 1;
  cricut.plugin_vulcan.proto.UpdatePodFirmwareResponse.Result result = 2;
  cricut.plugin_vulcan.proto.Progress progress = 3;
}

message UploadMainUnitFirmwareRequest {
  cricut.plugin_vulcan.proto.ConnectionInfo connection = 1;
  string firmware_path = 2;
  bytes firmware_data = 3;
  uint32 firmware_version = 4;
}

message UploadMainUnitFirmwareResponse {
  enum Result {
    UNKNOWN = 0;
    SUCCESS = 1;
    ERROR_NO_DEVICE = 2;
    ERROR_INVALID_FIRMWARE = 3;
    ERROR_UPLOAD_FAILED = 4;
    ERROR_DEVICE_AUTH_FAILED = 5;
  }
  cricut.plugin_vulcan.proto.DeviceId device_id = 1;
  cricut.plugin_vulcan.proto.UploadMainUnitFirmwareResponse.Result result = 2;
  cricut.plugin_vulcan.proto.Progress progress = 3;
}

message ActivatePodRequest {
  enum Action {
    ACTIVATE = 0;
    DEACTIVATE = 1;
  }
  cricut.plugin_vulcan.proto.ConnectionInfo connection = 1;
  cricut.plugin_vulcan.proto.ActivatePodRequest.Action action = 2;
}

message ActivatePodResponse {
  enum Result {
    UNKNOWN = 0;
    SUCCESS = 1;
    ERROR_NO_DEVICE = 2;
    ERROR_DEVICE_AUTH_FAILED = 3;
  }
  cricut.plugin_vulcan.proto.DeviceId device_id = 1;
  cricut.plugin_vulcan.proto.ActivatePodResponse.Result result = 2;
}

message GetDeviceErrorsRequest {
  cricut.plugin_vulcan.proto.ConnectionInfo connection = 1;
}

message GetDeviceErrorsResponse {
  enum Result {
    UNKNOWN = 0;
    SUCCESS = 1;
    ERROR_NO_DEVICE = 2;
    ERROR_DEVICE_AUTH_FAILED = 3;
  }
  message ErrorInfo {
    uint32 error = 1;
    uint32 count = 2;
  }
  cricut.plugin_vulcan.proto.DeviceId device_id = 1;
  cricut.plugin_vulcan.proto.GetDeviceErrorsResponse.Result result = 2;
  repeated uint32 pod_errors = 3;
  repeated uint32 main_unit_errors = 4;
  repeated cricut.plugin_vulcan.proto.GetDeviceErrorsResponse.ErrorInfo pod_error_stack = 5;
  repeated cricut.plugin_vulcan.proto.GetDeviceErrorsResponse.ErrorInfo main_unit_error_stack = 6;
}

message SetSerialNumberRequest {
  cricut.plugin_vulcan.proto.ConnectionInfo connection = 1;
  string serial_number = 2;
}

message SetSerialNumberResponse {
  enum Result {
    UNKNOWN = 0;
    SUCCESS = 1;
    ERROR_NO_DEVICE = 2;
    ERROR_SERIAL_NOT_SET = 3;
    ERROR_DEVICE_AUTH_FAILED = 4;
  }
  cricut.plugin_vulcan.proto.DeviceId device_id = 1;
  cricut.plugin_vulcan.proto.SetSerialNumberResponse.Result result = 2;
}

message InvalidRequestResponse {
  string request = 1;
}

message Request {
  cricut.plugin_vulcan.proto.FindDevicesRequest find_devices = 1;
  cricut.plugin_vulcan.proto.GetPodInfoRequest get_pod_info = 2;
  cricut.plugin_vulcan.proto.UpdatePodFirmwareRequest update_pod_firmware = 3;
  cricut.plugin_vulcan.proto.UploadMainUnitFirmwareRequest upload_main_unit_firmware = 4;
  cricut.plugin_vulcan.proto.ActivatePodRequest activate_pod = 5;
  cricut.plugin_vulcan.proto.GetDeviceErrorsRequest get_device_errors = 6;
  cricut.plugin_vulcan.proto.SetSerialNumberRequest set_device_serial_number = 7;
}

message Response {
  cricut.plugin_vulcan.proto.FindDevicesResponse find_devices = 1;
  cricut.plugin_vulcan.proto.GetPodInfoResponse get_pod_info = 2;
  cricut.plugin_vulcan.proto.UpdatePodFirmwareResponse update_pod_firmware = 3;
  cricut.plugin_vulcan.proto.UploadMainUnitFirmwareResponse upload_main_unit_firmware = 4;
  cricut.plugin_vulcan.proto.ActivatePodResponse activate_pod = 5;
  cricut.plugin_vulcan.proto.GetDeviceErrorsResponse get_device_errors = 6;
  cricut.plugin_vulcan.proto.SetSerialNumberResponse set_device_serial_number = 7;
  cricut.plugin_vulcan.proto.InvalidRequestResponse invalid_request = 100;
}

