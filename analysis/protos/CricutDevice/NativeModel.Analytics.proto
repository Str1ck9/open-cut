// recovered FileDescriptorProto: NativeModel.Analytics.proto
syntax = "proto3";
package NativeModel;
import "NativeModel.Machines.proto";

message PBMachineMaterialsSettingsV2 {
  NativeModel.PBMachineType machineID = 1;
  repeated NativeModel.PBMaterialSettingV2 customMaterials = 2;
  repeated NativeModel.PBMaterialSettingV2 customMaterialDefault = 3;
  repeated NativeModel.PBMaterialSettingV2 dialSettings = 4;
}

message PBMaterialSettingV2 {
  int32 materialSettingsID = 1;
  string type = 2;
  int32 userMachineID = 3;
  NativeModel.PBMachineType machineID = 4;
  string materialName = 5;
  int32 dialPosition = 6;
  int32 calibrationDialPosition = 7;
  double modifiedByPercentage = 8;
  int32 overrideID = 9;
  int32 multiCut = 10;
  int32 cutSpeed = 11;
  int32 cutSpeedCalibration = 12;
  int32 cutSpeedMin = 13;
  int32 cutSpeedMax = 14;
  int32 cutPressure = 15;
  int32 cutPressureCalibration = 16;
  int32 cutPressureMin = 17;
  int32 cutPressureMax = 18;
  int32 drawFeltSpeed = 19;
  int32 drawFeltSpeedCalibration = 20;
  int32 drawFeltSpeedMin = 21;
  int32 drawFeltSpeedMax = 22;
  int32 drawFeltPressure = 23;
  int32 drawFeltPressureCalibration = 24;
  int32 drawFeltPressureMin = 25;
  int32 drawFeltPressureMax = 26;
  int32 drawRollerSpeed = 27;
  int32 drawRollerSpeedCalibration = 28;
  int32 drawRollerSpeedMin = 29;
  int32 drawRollerSpeedMax = 30;
  int32 drawRollerPressure = 31;
  int32 drawRollerPressureCalibration = 32;
  int32 drawRollerPressureMin = 33;
  int32 drawRollerPressureMax = 34;
  int32 scoreSpeed = 35;
  int32 scoreSpeedCalibration = 36;
  int32 scoreSpeedMin = 37;
  int32 scoreSpeedMax = 38;
  int32 scorePressure = 39;
  int32 scorePressureCalibration = 40;
  int32 scorePressureMin = 41;
  int32 scorePressureMax = 42;
  int32 cutterStepper = 43;
  int32 rollerPenStepper = 44;
  int32 feltPenStepper = 45;
  int32 scoreStepper = 46;
  string uid = 47;
  bool isCustom = 48;
  bool isEditEnabled = 49;
  int32 bladeType = 50;
}

