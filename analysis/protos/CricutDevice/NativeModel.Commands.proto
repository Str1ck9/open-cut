  NativeModel.Bridge.PBSerialNumber set_serial = 39;
  NativeModel.Bridge.PBSerialNumber get_serial = 40;
  NativeModel.Bridge.PBGetFullStatus get_full_status = 42;
}

message PBActivateDeactivateCommand {
  bool should_activate = 1;
  string response = 2;
}

message PBWritePressTemp {
  int32 temp = 1;
  string response = 2;
}

message PBEEasyPressClassOriginCommand {
  NativeModel.Bridge.PBActivateDeactivateCommand activate_deactivate = 1;
  NativeModel.Bridge.PBWritePressTemp write_press_temp = 2;
}

message PBSetFanSettings {
  bool set_fan_speed = 1;
  float fan_speed = 2;
  bool set_material_absent_timeout = 3;
  int32 material_absent_timeout_seconds = 4;
  bool set_inactivity_timeout = 5;
  int32 inactivity_timeout_seconds = 6;
}

message PBGetFanSettings {
  float fan_speed = 1;
  int32 material_absent_timeout_seconds = 2;
  int32 inactivity_timeout_seconds = 3;
}

message PBMorphOriginCommand {
  NativeModel.Bridge.PBSetFanSettings set_fan_settings = 1;
  NativeModel.Bridge.PBGetFanSettings get_fan_settings = 2;
}

