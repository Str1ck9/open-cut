  int32 motor_fifo_full = 11;
  bool mat_loaded = 12;
  int32 mat_in_motion = 13;
  int32 homing_cariage = 14;
  int32 blade_down = 15;
  int32 cut_pressed = 16;
  uint32 mat_length = 17;
