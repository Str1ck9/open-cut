  int32 i_value_0 = 1;
  int32 i_value_1 = 2;
  int32 i_value_2 = 3;
  int32 i_value_3 = 4;
  int32 i_value_4 = 5;
  int32 i_value_5 = 6;
  int32 i_value_6 = 7;
  int32 i_value_7 = 8;
  int32 converted_value = 9;
  string serial = 10;
}

message PBCommand {
  NativeModel.Bridge.PBZorroOriginCommand zorro = 3;
  NativeModel.Bridge.PBEEasyPressClassOriginCommand ez_class = 9;
  NativeModel.Bridge.PBSetPlatformSequence set_platform_sequence = 11;
  NativeModel.Bridge.PBMorphOriginCommand morph = 12;
  bool success = 5;
  string error_message = 6;
  bool expect_response = 7;
}

message PBCommandLog {
  int64 timestamp = 1;
  bool is_request = 2;
  bool is_encrypted = 4;
  int32 size = 5;
  string hex_bytes = 8;
  string details = 9;
  string timestamp_str = 10;
  bytes raw_bytes = 11;
  int32 command_type_new = 12;
}

message PBCommandLogs {
  repeated NativeModel.Bridge.PBCommandLog logs = 1;
}

message PBRawCommandRequestResponse {
  int32 request_command = 1;
  int32 response_command = 3;
  int32 response_total_size = 5;
  int32 timeout = 6;
  bytes request_command_bytes = 7;
  bytes response_command_bytes = 8;
}

