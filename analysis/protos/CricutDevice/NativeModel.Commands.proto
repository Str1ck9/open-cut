message PBAck {
  bool ack_received = 1;
  bool command_dropped = 2;
  bool motor_error = 3;
  bytes status_byte1 = 4;
  bytes status_byte2 = 5;
  bytes error_code = 6;
  bytes fifo_count = 7;
  bool pause_pressed = 8;
  bool matload_unload_pressed = 9;
  int32 bytes_received = 10;
  NativeModel.Bridge.PBBridgeApiError bridge_error_enum = 11;
  NativeModel.Bridge.PBSeverity bridge_error_severity = 12;
}

message PBDrawVectors {
  repeated NativeModel.Bridge.PBDrawVector vectors = 1;
  double in_blade_angle = 7;
  double out_blade_angle = 8;
  double machine_blade_angle = 9;
  bool is_closed_path = 10;
}

message PBDrawVector {
  NativeModel.Bridge.PBDrawVectorType cut_type = 1;
  NativeModel.PBPoint point = 2;
  bool completed = 3;
  bool attempting_to_send = 4;
  int32 command_number = 5;
}

