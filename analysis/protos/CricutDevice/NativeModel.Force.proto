// recovered FileDescriptorProto: NativeModel.Force.proto
syntax = "proto3";
package NativeModel.Bridge;
import "NativeModel.Devices.proto";
import "NativeModel.Machines.proto";

enum PBForceGaugeVendorType {
  UNKNOWN_FGDT = 0;
  INTRETECH_FGDT = 1;
  UNIQUE_FGDT = 2;
  MOCK_FGDT = 3;
}

enum PBForceMatType {
  NONE_FMT = 0;
  SINGLE_FMT = 1;
  DOUBLE_FMT = 2;
  TRIPLE_FMT = 3;
  HALF_MM_SHIM_FMT = 4;
}

enum PBForceAccessoryType {
  LOW_CUT_FAT = 0;
  HIGH_CUT_FAT = 1;
  LOW_ACC_FAT = 2;
  NONE_FAT = 3;
  LOW_CUT_MATLESS_FAT = 4;
  LOW_ACC_MATLESS_FAT = 5;
}

enum PBThetaBiasMode {
  T_BIAS_1 = 0;
  T_BIAS_2 = 1;
  T_BIAS_3 = 2;
  CCW = 3;
}

enum PBThetaBiasRotate {
  DEFAULT_TBR = 0;
  NONE_TBR = 1;
  ALWAYS_BOTTOM_TBR = 2;
  ALTERNATE_TBR = 3;
}

message PBForceGaugeDevice {
  int32 com_port = 1;
  string serial = 2;
  NativeModel.Bridge.PBForceAccessoryType accessory_type = 3;
  int32 times_measured = 4;
  int32 last_read_pressure = 5;
  NativeModel.Bridge.PBForceGaugeVendorType vendor_type = 6;
  string com_port_string = 7;
}

message PBForceExecutionPlan {
  string id = 1;
  repeated NativeModel.Bridge.PBForceExecution executions = 2;
}

message PBForceExecution {
  string id = 1;
  NativeModel.Bridge.PBForceAccessoryType accessory_type = 2;
  NativeModel.Bridge.PBForceMatType mat_type = 3;
  NativeModel.Bridge.PBForceGaugeDevice force_device = 5;
}

message PBForceTarget {
  double start_position = 1;
  double target_gram = 2;
  double min_position = 3;
  double max_position = 4;
  string id = 5;
}

message PBForceGaugeSettings {
  string id = 1;
  uint32 low_cut_port = 2;
  uint32 low_accessory_port = 3;
  uint32 high_cut_port = 4;
  repeated NativeModel.Bridge.PBForceTarget blade_low_targets = 5;
  repeated NativeModel.Bridge.PBForceTarget accessory_low_targets = 6;
  repeated NativeModel.Bridge.PBForceTarget blade_high_targets = 7;
  double gear_ratio_a = 8;
  double gear_ratio_b = 9;
  bool force_use_mock_gauge_device = 10;
  repeated NativeModel.Bridge.PBForceGaugeDevice found_force_devices = 11;
  string message = 12;
}

message PBForceGaugeInitialRead {
  string id = 1;
  double pos_mm = 2;
  double grams = 3;
  double pos_error_encoder_cnts = 4;
  double incr_change_x = 5;
  double incr_change_y = 6;
}

message PBForceGaugeHistoryItem {
  string id = 1;
  int32 index = 2;
  double target_grams = 3;
  double low_limit = 4;
  double high_limit = 5;
  double start_z_position = 6;
  double start_increment_position = 7;
  NativeModel.Bridge.PBForceGaugeInitialRead initial_read = 8;
  repeated NativeModel.Bridge.PBForceGaugeInitialRead measure_read = 9;
  NativeModel.Bridge.PBForceGaugeInitialRead final_read = 10;
  NativeModel.Bridge.PBForceExecution execution = 11;
}

message PBForceGaugeHistory {
  string id = 1;
  string version = 2;
  bool result = 3;
  string time = 4;
  repeated NativeModel.Bridge.PBForceGaugeHistoryItem items = 5;
  string serial = 6;
  NativeModel.Bridge.PBForceMatType mat_type = 8;
  NativeModel.Bridge.PBForceAccessoryType device_type = 9;
  NativeModel.PBMachineType machine_type = 10;
}

message PBForceGaugeHistories {
  string id = 1;
  string version = 2;
  bool result = 3;
  string time = 4;
  string serial = 5;
  NativeModel.Bridge.PBForceGaugeHistory low_cut_history = 6;
  NativeModel.Bridge.PBForceGaugeHistory low_acc_history = 7;
  NativeModel.Bridge.PBForceGaugeHistory high_cut_history = 8;
  NativeModel.Bridge.PBForceMatType current_mat_type = 9;
  NativeModel.Bridge.PBForceAccessoryType current_device_type = 10;
}

message PBPressureTableRow {
  NativeModel.Bridge.PBForceAccessoryType force_accessory_type = 1;
  int32 memory_position = 2;
  uint32 grams = 3;
  uint32 encoder_pos_mm = 4;
  double converted_mm_position = 5;
  uint32 encoder_pos_mm_mat_less = 6;
  uint32 encoder_pos_mm_card_mat = 7;
  double converted_mm_position_mat_less = 8;
  double converted_mm_position_card_mat = 9;
}

message PBForceCurve {
  enum PBMeasureTwice {
    DEFAULT_DO_NOT_MEASURE_TWICE = 0;
    TAKE_HIGHER_GRAM = 1;
    TAKE_LOWER_GRAM = 2;
  }
  enum PBForceCurveActionType {
    STANDARD_FCA = 0;
    VERIFY_PRESSURE_TABLE_FCA = 1;
    MEASURE_PRESSURES_AT_POSITIONS_FCA = 2;
  }
  double start_depth_encoder_counts = 1;
  double end_depth_encoder_counts = 2;
  double increment_encoder_counts = 3;
  double gear_ratio_a = 5;
  double gear_ratio_b = 6;
  NativeModel.Bridge.PBForceAccessoryType accessory_type = 7;
  repeated NativeModel.Bridge.PBForceCurveItem items = 8;
  NativeModel.Bridge.PBForceMatType mat_type = 9;
  int32 max_grams_before_exit = 10;
  NativeModel.Bridge.PBForceCurve.PBMeasureTwice measure_twice = 11;
  NativeModel.Bridge.PBForceGaugeDevice device = 12;
  bool should_plunge_head = 14;
  int32 dwell_time = 15;
  NativeModel.Bridge.PBForceCurve.PBForceCurveActionType curve_action_type = 16;
  repeated double measure_pressure_at_positions = 17;
}

message PBForceCurveItem {
  double encoder_counts = 1;
  double pressure = 2;
  bool gear_ratio_a_selected = 3;
  double gear_ratio = 4;
  double pos_mm = 5;
  int32 verify_reference_memory_position = 6;
}

message PBGearRatio {
  double x_gear_ratio = 1;
  double y_gear_ratio = 2;
  NativeModel.PBSize square_size = 3;
  double x1 = 4;
  double x2 = 5;
  double x3 = 6;
  double y1 = 7;
  double y2 = 8;
  double y3 = 9;
  double adjusted_x_gear_ratio = 10;
  double y_gear_ratio_matless = 12;
  double adjusted_y_gear_ratio = 13;
  double adjusted_y_gear_ratio_matless = 14;
  bool is_matless = 15;
  double x_offset = 16;
  double y_offset = 17;
}

message PBPenToBlade {
  bool do_not_apply_offsets = 1;
  bool save_as_factory_defaults = 2;
  int32 horizontal = 3;
  int32 vertical = 4;
  float current_pen_to_blade_x = 5;
  float current_pen_to_blade_y = 6;
  uint32 current_pen_to_blade_x_int = 7;
  uint32 current_pen_to_blade_y_int = 8;
  float current_pen_to_blade_x_flash = 9;
  float current_pen_to_blade_y_flash = 10;
  uint32 current_pen_to_blade_x_int_flash = 11;
  uint32 current_pen_to_blade_y_int_flash = 12;
  float pen_to_blade_new_x = 13;
  float pen_to_blade_new_y = 14;
}

message PBThetaBias {
  NativeModel.Bridge.PBThetaBiasMode mode = 1;
  float x_spacing = 2;
  float y_spacing = 3;
  float x_position = 4;
  float y_position = 5;
  float begin_value = 6;
  float end_value = 7;
  int32 x_steps = 8;
  int32 y_steps = 9;
  float start_angle_radians = 10;
  float selected_value_radians = 11;
  float current_value_theta1 = 12;
  float current_value_theta2 = 13;
  float current_value_theta3 = 14;
  float current_value_ccw = 15;
  float diameter_theta1 = 16;
  float diameter_theta2 = 17;
  float diameter_theta3 = 18;
  float diameter_ccw = 19;
  bool force_pack_commands = 20;
  NativeModel.Bridge.PBThetaBiasRotate rotate_settings = 22;
}

message PBThetaHomeOffset {
  float test_location_x = 1;
  float test_location_y = 2;
  float ref_line_inch = 3;
  float rolling_blade_spacing = 4;
  int32 num_rows = 5;
  float save_values_degrees = 6;
  int32 num_columns = 7;
  float rolling_blade_vertical_spacing = 8;
  bool use_ix_verification_method = 9;
}

message PBProductionLineParallelOffset {
  float start_x_inch = 1;
  float start_y_inch = 2;
  float spacing_inch = 3;
  float begin_value_inch = 4;
  float end_value_inch = 5;
  uint32 number_of_steps = 6;
  float value_in_flash = 7;
  float best_value = 8;
  float new_value = 9;
  uint32 cuts_per_row = 10;
}

