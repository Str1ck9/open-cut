// recovered FileDescriptorProto: NativePathOperation.proto
syntax = "proto3";
package NativePathOperation;

enum PBVectorFillType {
  NONE_VFT = 0;
  LINES_VFT = 1;
  CONCENTRIC_VFT = 2;
  PARTICLE_VFT = 3;
  PATTERN_VFT = 4;
  WAVES_VFT = 5;
}

enum PBVectorFillWaveType {
  NONE_VFWT = 0;
  SINE_VFWT = 1;
  SQUARE_VFWT = 2;
  TRIANGLE_VFWT = 3;
}

enum PBSVGCommand {
  EMPTY_SVGC = 0;
  INVALID_SVGC = -1;
  M_SVGC = 1;
  C_SVGC = 2;
  H_SVGC = 3;
  V_SVGC = 4;
  L_SVGC = 5;
  Z_SVGC = 6;
}

