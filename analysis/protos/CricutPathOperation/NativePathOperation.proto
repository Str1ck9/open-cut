  double offset = 4;
  double line_angle = 5;
  double particle_max_random_spacing = 6;
  double particle_random_rotation = 7;
  double particle_min_scale = 8;
  double particle_max_scale = 9;
  string particle_fill_path = 10;
  double particle_phase = 11;
  NativePathOperation.PBVectorFillWaveType wave_type = 12;
  uint32 wave_number_of_half_waves = 13;
  double wave_phase = 14;
  double wave_amplitude = 15;
  uint32 wave_period = 16;
}

message PBSVGPathNode {
